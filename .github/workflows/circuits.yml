name: Circuits

on:
  push:
    branches:
      - dev
      - main
      - master
    tags:
      - "v*"
    paths:
      - "circuits/**"
      - "contracts/verifier-insert-vk.tolk"
      - "contracts/verifier-withdraw-vk.tolk"
      - "scripts/ci/check-ceremony-chain.sh"
      - ".github/workflows/circuits.yml"
  pull_request:
    branches:
      - dev
      - main
      - master
    paths:
      - "circuits/**"
      - "contracts/verifier-insert-vk.tolk"
      - "contracts/verifier-withdraw-vk.tolk"
      - "scripts/ci/check-ceremony-chain.sh"
      - ".github/workflows/circuits.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  compile-and-check:
    name: Compile + constraint baseline + toolchain pin
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    defaults:
      run:
        working-directory: circuits

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout pinned ceremony artifacts
        env:
          CEREMONY_COMMIT: 2a300cd303edb70e86f9663140174eba7c21d87d
          CEREMONY_REPOSITORY: https://github.com/TONresistor/zk-resistor-ceremony.git
        run: |
          set -euo pipefail
          ceremony_dir="$RUNNER_TEMP/zkresistor-ceremony"
          git init "$ceremony_dir"
          git -C "$ceremony_dir" remote add origin "$CEREMONY_REPOSITORY"
          git -C "$ceremony_dir" sparse-checkout init --no-cone
          git -C "$ceremony_dir" sparse-checkout set --no-cone \
            transcript/contributions.json \
            circuits/insert.r1cs \
            circuits/withdraw.r1cs \
            phase1/pot_0024_drand-beacon.ptau \
            phase2/insert_0013_drand-beacon.zkey \
            phase2/withdraw_0013_drand-beacon.zkey
          git -C "$ceremony_dir" fetch --depth=1 --filter=blob:none origin "$CEREMONY_COMMIT"
          git -C "$ceremony_dir" checkout --detach FETCH_HEAD

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: circuits/package-lock.json

      - name: Install Rust (for circom)
        uses: dtolnay/rust-toolchain@1ff72ee08e3cb84d84adba594e0a297990fc1ed3 # stable
        with:
          toolchain: stable

      - name: Install circom 2.2.3
        run: |
          cargo install --git https://github.com/iden3/circom.git --tag v2.2.3 --locked circom

      - name: Install dependencies
        run: npm ci

      - name: Toolchain version pin
        run: npm run check:toolchain

      - name: Compile circuits
        run: npm run compile

      - name: Canonical ZEROS[] integrity (EMPTY_TREE_ROOT gate)
        run: npm run check:zeros

      - name: Exact R1CS release pins
        run: npm run check:constraints

      - name: Ceremony release chain
        run: bash ../scripts/ci/check-ceremony-chain.sh "$RUNNER_TEMP/zkresistor-ceremony"
