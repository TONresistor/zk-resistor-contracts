name: Contracts

on:
  push:
    branches:
      - dev
      - main
      - master
  pull_request:
    branches:
      - dev
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build, Test, Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: circuits/package-lock.json

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # action v1.0.0; CLI from Acton.toml

      - name: Legacy verifier bypass must be absent
        run: |
          if grep -R -n -E 'MOCK_VERIFIER|verifyInsertProofForced|verifyWithdrawProofForced' contracts; then
            echo "::error::A legacy verifier bypass remains in production source."
            exit 1
          fi
          echo "No verifier bypass found."

      - name: Install circuit JS dependencies
        working-directory: circuits
        run: npm ci

      - name: Toolchain diagnostics
        run: |
          acton --version
          acton doctor

      - name: Whitespace
        run: git diff --check

      - name: Build
        run: acton build --clear-cache --info

      - name: README build hash drift
        run: python3 scripts/ci/check-readme-hashes.py

      - name: Verifying key drift
        run: bash scripts/ci/check-vk-drift.sh

      - name: Formatter
        run: acton fmt --check

      - name: Linter
        run: acton check --output-format github

      - name: Test
        run: acton test --clear-cache --reporter dot --backtrace full

      - name: Coverage floor
        run: |
          mkdir -p build/ci
          acton test tests \
            --coverage \
            --coverage-format lcov \
            --coverage-file build/ci/lcov.info \
            --reporter dot
          node scripts/ci/check-lcov-lines.mjs build/ci/lcov.info 95
