name: Contracts Heavy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  heavy-qa:
    name: Coverage, Gas, Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 75

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: circuits/package-lock.json

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0

      - name: Install circuit JS dependencies
        working-directory: circuits
        run: npm ci

      - name: Toolchain diagnostics
        run: |
          acton --version
          acton doctor

      - name: Whitespace
        run: git diff --check

      - name: Build
        run: acton build --clear-cache --info

      - name: README build hash drift
        run: python3 scripts/ci/check-readme-hashes.py

      - name: Verifying key drift
        run: bash scripts/ci/check-vk-drift.sh

      - name: Coverage floor
        run: |
          mkdir -p build/ci-heavy
          acton test \
            --coverage \
            --coverage-format text \
            --coverage-file build/ci-heavy/coverage.txt \
            --coverage-minimum-percent 95 \
            --reporter dot

      - name: Gas snapshot
        run: |
          mkdir -p build/ci-heavy
          acton test --snapshot build/ci-heavy/gas-snapshot.json --reporter dot

      - name: Mutation
        run: bash scripts/ci/run-mutation.sh
